name: Android build

on:
  push:
    branches: [main, "feature/sonora-tv-pairing"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build phone and TV apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APKs
        run: gradle --no-daemon :remote:assembleDebug :tv:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apks
          path: |
            remote/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
