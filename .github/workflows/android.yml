name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build phone and TV apps
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out Sonora TV web source
        uses: actions/checkout@v7
        with:
          repository: jhooni467/Sonora-TV-
          ref: main
          path: sonora-tv-source

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Verify bundled TV player is synchronized
        run: diff -u sonora-tv-source/index.html remote/src/main/assets/sonora-tv/index.html

      - name: Validate bundled Sonora TV JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html_path = Path("remote/src/main/assets/sonora-tv/index.html")
          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("No se encontró JavaScript en el reproductor Sonora TV.")
          Path("/tmp/sonora-tv.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"JavaScript extraído de {html_path}: {len(scripts)} bloque(s)")
          PY
          node --check /tmp/sonora-tv.js

      - name: Build debug APKs
        run: gradle --no-daemon :remote:assembleDebug :tv:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apks
          path: |
            remote/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
